<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Chat app</title>
</head>
<body>
    <h1 class="title">CHATTTT </h1>
    <p id = "socket-mssg"></p>

    <div class="main">
        <div class="name">
            <span>User | </span>
            <input type="text" class="name-input" id = "name-input"  value="anonymous">
        </div>
        <ul class="message-container"id="message-container">
            <li class="message-left">
                <p class="message">lorem ipsum
                    <span>bluebird ** 23 jun 10:31</span>
                </p>

            </li>
            <li class="message-right">
                <p class="message">lorem ipsum
                    <span>bluebird ** 23 jun 10:31</span>
                </p>

            </li>
            <li class="message-feedback">
                <p class="feedback" id="feedback">
                    he is typing a message.....
                </p>
            </li>
        </ul>

        <form  class="message-form" id="message-form">
            <input type="text"  name = "message" id="message-input" class="message-input">
            <div class="v-divider"></div>
            <button type = "submit" class="send-button" id = "send-button" >SEND</button>
        </form>

    </div>
    <h3 class="clients-total" id="clients-total">TOtal clients</h3>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js" integrity="sha512-4F1cxYdMiAW98oomSLaygEwmCnIP38pb4Kx70yQYqRwLVCs3DbRumfBq82T08g/4LJ/smbFGFpmeFlQgoDccgg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="main.js"></script>
</body>
</html>
